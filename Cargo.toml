[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
hestia-core = { path = "crates/hestia-core" }
hestia-hub = { path = "crates/hestia-hub" }
hestia-govee = { path = "crates/hestia-govee" }
hestia-api = { path = "crates/hestia-api" }
hestia-homekit = { path = "crates/hestia-homekit" }
hestia-minecraft = { path = "crates/hestia-minecraft" }
hestia-ping = { path = "crates/hestia-ping" }
hestia-system = { path = "crates/hestia-system" }
hestia-freebox = { path = "crates/hestia-freebox" }
hestia-history = { path = "crates/hestia-history" }

anyhow = "1"
argon2 = { version = "0.5", features = ["std"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
chacha20poly1305 = "0.10"
ed25519-dalek = "2"
hkdf = "0.12"
hmac = "0.12"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
sha1 = "0.10"
mdns-sd = "0.21"
num-bigint = "0.4"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
redb = "4"
rand_core = { version = "0.6", features = ["getrandom"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
rpassword = "7"
sha2 = "0.10"
tower = { version = "0.5", features = ["util"] }
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "net", "time", "sync", "signal"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

# Password hashing is far too slow unoptimised, even in debug builds.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"
